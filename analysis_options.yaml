include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
  exclude:
    - pkgs/**
    - scratch/**
    - .jetski/**
    - debug_*.dart
    - test_*.dart
  errors:
    doc_directive_unknown: ignore

linter:
  rules:
    # A library must never write to stdout. Leftover debug prints in the
    # parser previously spammed every consumer's output and surfaced as
    # build_runner warnings.
    - avoid_print
