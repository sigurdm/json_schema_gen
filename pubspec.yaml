name: json_schema_gen
version: 0.1.0
description: >-
  A JSON Schema (Draft 2020-12) code generator and runtime validator for Dart,
  compiling schemas to type-safe models using streaming JSON parsing.
repository: https://github.com/sigurdm/json_schema_gen
issue_tracker: https://github.com/sigurdm/json_schema_gen/issues
topics:
  - json-schema
  - code-generation
  - serialization
  - validation

executables:
  json_schema_gen:

workspace:
  - example

environment:
  sdk: ^3.10.0

dependencies:
  args: ^2.5.0
  build: ^4.0.6
  code_builder: ^4.10.1
  collection: ^1.19.1
  dart_style: ^3.1.9
  jsontool: ^2.1.0
  path: ^1.9.1
  pub_semver: ^2.1.4

dev_dependencies:
  build_runner: ^2.4.0
  lints: ^5.0.0
  test: ^1.24.0
