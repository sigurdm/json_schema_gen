name: Dart CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project
        run: dart analyze

      - name: Run build_runner
        run: dart run build_runner build

      - name: Regenerate bootstrapped metaschema
        run: dart run tool/test_bootstrap_gen.dart && dart format lib/src/generated/schema_202012.g.dart

      # Tests run before the up-to-date check so that a stale generated file
      # cannot mask a genuine test failure. Previously this job never reached
      # the test step at all.
      - name: Run tests
        run: dart test

      - name: Ensure generated code is up-to-date
        run: git diff --exit-code
